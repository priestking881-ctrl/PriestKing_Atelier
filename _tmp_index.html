    <link rel="stylesheet" href="/priest/assets/css/style.css">
    <script>
        (function () {
            try {
                var t = localStorage.getItem('priest-theme');
                if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                    document.documentElement.classList.add('dark');
                }
            } catch (e) {}
        })();
    </script>

<body class="auth-page">
    <div class="auth-wrapper">
        <div class="auth-panel">
            <div class="auth-brand">
                <img class="auth-logo" src="/priest/assets/images/priest-logo.svg" alt="PRIEST Atelier logo">
                <div>
                    <h2>PRIEST</h2>
                    <small>ATELIER · TAILORING & DESIGN</small>
                </div>
            </div>

            
            <form method="post" class="auth-form">
                <input type="hidden" name="csrf_token" value="cc7b01a61b539f45bc56df0d43a2839db606b78a2def30891a367f1e290a3519">
                <label>
                    <span>Email Address</span>
                    <input type="email" name="email" placeholder="you@example.com" required>
                </label>
                <label>
                    <span>Password</span>
                    <input type="password" name="password" placeholder="Enter password" required>
                </label>
                <button type="submit" class="btn btn-primary w-100"><i class="fa-solid fa-right-to-bracket"></i> Sign In</button>
            </form>

            <div class="auth-foot">
                <small>New user? <a href="/priest/customer-register.php">Create a customer account</a> to place orders and browse designs.</small>
            </div>
        </div>
    </div>
</body>
</html>
